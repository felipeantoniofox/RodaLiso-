name: Pipeline DevSecOps - Roda Liso

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-security:
    runs-on: windows-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' 

    - name: Instalar ferramentas de Segurança e Build
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety pyinstaller
        # Se você tiver um requirements.txt criado, tire o '#' da linha abaixo para instalar suas bibliotecas:
        # pip install -r requirements.txt

    - name: DevSecOps - Análise Estática de Segurança (Bandit)
      run: bandit -r . -ll -ii
      # Avalia o código procurando vulnerabilidades médias e altas.

    - name: DevSecOps - Verificação de Dependências (Safety)
      run: safety check --bare
      continue-on-error: true # Continua o pipeline mesmo se achar uma lib desatualizada

    - name: CD - Gerar Executável (PyInstaller)
      # Importante: Substitua 'main.py' pelo nome exato do arquivo principal que inicia o seu aplicativo
      run: pyinstaller --onefile main.py 
      continue-on-error: true

    - name: CD - Disponibilizar Executável (Artefato)
      uses: actions/upload-artifact@v4
      with:
        name: RodaLiso-Release
        path: dist/