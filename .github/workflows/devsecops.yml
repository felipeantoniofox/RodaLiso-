name: Pipeline DevSecOps - Roda Liso

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-security:
    runs-on: windows-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' 

    - name: Instalar ferramentas de Segurança e Build
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety pyinstaller
        # Se tiver um requirements.txt, desmarque a linha abaixo:
        # pip install -r requirements.txt

    - name: DevSecOps - Análise Estática de Segurança (Bandit)
      run: bandit -r . -x "backup*,outras coisas*,Rodaliso_Backups*" -ll -ii
      continue-on-error: true

    - name: DevSecOps - Verificação de Dependências (Safety)
      run: safety check --bare
      continue-on-error: true

    - name: Injetar Variáveis de Ambiente da API (Secrets)
      run: echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > api.env

    - name: CD - Gerar Executável (PyInstaller)
      run: pyinstaller --onefile roda_liso.py 
      continue-on-error: true

    - name: CD - Disponibilizar Executável (Artefato)
      uses: actions/upload-artifact@v4
      with:
        name: RodaLiso-Release
        path: dist/